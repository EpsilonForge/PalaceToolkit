name: Build Palace CPU Wheel

on:
  workflow_dispatch:
    inputs:
      palace_ref:
        description: "Palace git ref (branch/tag/sha)"
        required: false
        default: "main"
  pull_request:
    paths:
      - "packages/palacetoolkit-palace-cpu/**"
      - ".github/workflows/palace-cpu-wheel.yml"
  push:
    tags:
      - "palace-cpu-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        target: [linux, windows]
    runs-on: ${{ matrix.target == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y \
            cmake gfortran openmpi-bin libopenmpi-dev libopenblas-dev pkg-config git make

      - name: Install MinGW toolchain and dependencies (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed `
            mingw-w64-x86_64-gcc `
            mingw-w64-x86_64-gcc-fortran `
            mingw-w64-x86_64-cmake `
            mingw-w64-x86_64-make `
            mingw-w64-x86_64-pkg-config `
            mingw-w64-x86_64-msmpi `
            mingw-w64-x86_64-openblas `
            mingw-w64-x86_64-hdf5 `
            mingw-w64-x86_64-metis
          if ($LASTEXITCODE -ne 0) { throw "pacman failed" }
          # MSYS2's cmake pulls in ninja 1.13.2 as dep, but we need our own ninja path
          mkdir -p C:\ninja-1111
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-win.zip" -OutFile "$env:TEMP\ninja.zip"
          Expand-Archive -Path "$env:TEMP\ninja.zip" -DestinationPath "C:\ninja-1111" -Force

      - name: Build Palace (Linux)
        if: matrix.target == 'linux'
        env:
          PALACE_REF: ${{ inputs.palace_ref || 'main' }}
        run: |
          set -euo pipefail
          git clone --branch "$PALACE_REF" --depth 1 https://github.com/awslabs/palace.git /tmp/palace-src

          cmake -S /tmp/palace-src -B /tmp/palace-build \
            -DCMAKE_INSTALL_PREFIX=/tmp/palace-install \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-O3 -ffp-contract=fast -funroll-loops -march=native" \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_C_FLAGS="-O3 -ffp-contract=fast -funroll-loops -march=native" \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_Fortran_FLAGS="-O3 -ffp-contract=fast -funroll-loops -march=native" \
            -DBUILD_SHARED_LIBS:BOOL=ON \
            -DPALACE_WITH_64BIT_INT:BOOL=OFF \
            -DPALACE_WITH_OPENMP:BOOL=ON \
            -DPALACE_WITH_CUDA:BOOL=OFF \
            -DPALACE_WITH_HIP:BOOL=OFF \
            -DPALACE_WITH_SUPERLU:BOOL=ON \
            -DPALACE_WITH_STRUMPACK:BOOL=ON \
            -DPALACE_WITH_MUMPS:BOOL=ON \
            -DPALACE_WITH_SLEPC:BOOL=ON \
            -DPALACE_WITH_ARPACK:BOOL=ON \
            -DPALACE_WITH_LIBXSMM:BOOL=ON \
            -DPALACE_WITH_MAGMA:BOOL=OFF \
            -DPALACE_WITH_GSLIB:BOOL=ON

          cmake --build /tmp/palace-build --parallel "$(nproc)"

      - name: Build Palace (Windows)
        if: matrix.target == 'windows'
        env:
          PALACE_REF: ${{ inputs.palace_ref || 'main' }}
        shell: C:\msys64\usr\bin\bash.exe -eo pipefail '{0}'
        run: bash packages/palacetoolkit-palace-cpu/scripts/build_windows.sh

      - name: Stage Palace payload into binary package (Linux)
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          ls -lah /tmp/palace-install/bin
          ./packages/palacetoolkit-palace-cpu/tools/stage_palace_binary.sh \
            /tmp/palace-install/bin \
            /tmp/palace-install/lib \
            /tmp/palace-install/lib64

      - name: Stage Palace payload into binary package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $buildRoot = $env:RUNNER_TEMP
          if (-not $buildRoot) { $buildRoot = "C:\msys64\tmp" }
          $palaceInstall = "$buildRoot\palace-install"
          .\packages\palacetoolkit-palace-cpu\tools\stage_palace_binary.ps1 `
            -BinDir "$palaceInstall\bin" `
            -LibDirs "$palaceInstall\lib", "$palaceInstall\lib64"

      - name: Build wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build wheel
          python -m build --wheel packages/palacetoolkit-palace-cpu
          ls -lah packages/palacetoolkit-palace-cpu/dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: palacetoolkit-palace-cpu-${{ matrix.target }}
          path: packages/palacetoolkit-palace-cpu/dist/*.whl

      - name: Attach wheel to GitHub release
        if: startsWith(github.ref, 'refs/tags/palace-cpu-v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/palacetoolkit-palace-cpu/dist/*.whl
          generate_release_notes: true