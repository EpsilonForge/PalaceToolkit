name: Build Palace CPU Wheel

on:
  workflow_dispatch:
    inputs:
      palace_ref:
        description: "Palace git ref (branch/tag/sha)"
        required: false
        default: "main"
  pull_request:
    paths:
      - "packages/palacetoolkit-palace-cpu/**"
      - ".github/workflows/palace-cpu-wheel.yml"
  push:
    tags:
      - "palace-cpu-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        target: [linux, windows]
    runs-on: ${{ matrix.target == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y \
            cmake gfortran openmpi-bin libopenmpi-dev libopenblas-dev pkg-config git make

      - name: Install MinGW toolchain and dependencies (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed `
            mingw-w64-x86_64-gcc `
            mingw-w64-x86_64-gcc-fortran `
            mingw-w64-x86_64-cmake `
            mingw-w64-x86_64-make `
            mingw-w64-x86_64-pkg-config `
            mingw-w64-x86_64-msmpi `
            mingw-w64-x86_64-openblas `
            mingw-w64-x86_64-hdf5 `
            mingw-w64-x86_64-metis
          if ($LASTEXITCODE -ne 0) { throw "pacman failed" }
          # Install Ninja 1.11.1 (older version without recompact feature that causes MFEM issues)
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-win.zip" -OutFile "$env:TEMP\ninja.zip"
          Expand-Archive -Path "$env:TEMP\ninja.zip" -DestinationPath "C:\msys64\mingw64\bin" -Force

      - name: Build Palace (Linux)
        if: matrix.target == 'linux'
        env:
          PALACE_REF: ${{ inputs.palace_ref || 'main' }}
        run: |
          set -euo pipefail
          git clone --branch "$PALACE_REF" --depth 1 https://github.com/awslabs/palace.git /tmp/palace-src

          cmake -S /tmp/palace-src -B /tmp/palace-build \
            -DCMAKE_INSTALL_PREFIX=/tmp/palace-install \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-O3 -ffp-contract=fast -funroll-loops -march=native" \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_C_FLAGS="-O3 -ffp-contract=fast -funroll-loops -march=native" \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_Fortran_FLAGS="-O3 -ffp-contract=fast -funroll-loops -march=native" \
            -DBUILD_SHARED_LIBS:BOOL=ON \
            -DPALACE_WITH_64BIT_INT:BOOL=OFF \
            -DPALACE_WITH_OPENMP:BOOL=ON \
            -DPALACE_WITH_CUDA:BOOL=OFF \
            -DPALACE_WITH_HIP:BOOL=OFF \
            -DPALACE_WITH_SUPERLU:BOOL=ON \
            -DPALACE_WITH_STRUMPACK:BOOL=ON \
            -DPALACE_WITH_MUMPS:BOOL=ON \
            -DPALACE_WITH_SLEPC:BOOL=ON \
            -DPALACE_WITH_ARPACK:BOOL=ON \
            -DPALACE_WITH_LIBXSMM:BOOL=ON \
            -DPALACE_WITH_MAGMA:BOOL=OFF \
            -DPALACE_WITH_GSLIB:BOOL=ON

          cmake --build /tmp/palace-build --parallel "$(nproc)"

      - name: Build Palace (Windows)
        if: matrix.target == 'windows'
        env:
          PALACE_REF: ${{ inputs.palace_ref || 'main' }}
        shell: C:\msys64\usr\bin\bash.exe -eo pipefail '{0}'
        run: |
          export PATH="/mingw64/bin:/usr/bin:/c/Program Files/Git/bin:/c/Program Files/Git/cmd:$PATH"
          BUILD_ROOT="$(echo "${RUNNER_TEMP:-/tmp}" | sed 's|\\|/|g')"
          PALACE_SRC="$BUILD_ROOT/palace-src"
          PALACE_BUILD="$BUILD_ROOT/palace-build"
          PALACE_INSTALL="$BUILD_ROOT/palace-install"
          git clone --branch "$PALACE_REF" --depth 1 https://github.com/awslabs/palace.git "$PALACE_SRC"

          # Stub FindMPI
          mkdir -p "$PALACE_SRC/cmake"
          for var in "MPI_C_FOUND TRUE" "MPI_CXX_FOUND TRUE" "MPI_Fortran_FOUND TRUE" "MPI_FOUND TRUE" 'MPI_C_COMPILER "gcc"' 'MPI_CXX_COMPILER "g++"' 'MPI_Fortran_COMPILER "gfortran"' 'MPI_C_INCLUDE_DIRS "C:/msys64/mingw64/include"' 'MPI_CXX_INCLUDE_DIRS "C:/msys64/mingw64/include"' 'MPI_Fortran_INCLUDE_DIRS "C:/msys64/mingw64/include"' 'MPI_C_LIBRARIES "C:/msys64/mingw64/lib/libmsmpi.dll.a"' 'MPI_CXX_LIBRARIES "C:/msys64/mingw64/lib/libmsmpi.dll.a"' 'MPI_Fortran_LIBRARIES "C:/msys64/mingw64/lib/libmsmpi.dll.a"' 'MPIEXEC_EXECUTABLE "C:/msys64/mingw64/bin/mpiexec.exe"'; do echo "set($var)" >> "$PALACE_SRC/cmake/FindMPI.cmake"; done

          # Fix patch file line endings
          find "$PALACE_SRC/extern/patch" -name "*.diff" -exec sed -i 's/\r$//' {} \;

          # Patch gslib and libxsmm to use mingw32-make
          sed -i 's/\${CMAKE_MAKE_PROGRAM}/mingw32-make/g' "$PALACE_SRC/cmake/ExternalGSLIB.cmake"
          sed -i 's/\${CMAKE_MAKE_PROGRAM}/mingw32-make/g' "$PALACE_SRC/cmake/ExternalLIBXSMM.cmake"
          sed -i '/STATIC=0/s/$/ WERROR=0 WCHECK=0/' "$PALACE_SRC/cmake/ExternalLIBXSMM.cmake"
          # Disable libCEED
          sed -i 's/INSTALL_COMMAND.*/INSTALL_COMMAND ""\n  BUILD_COMMAND     ""\n  CONFIGURE_COMMAND ""/' "$PALACE_SRC/cmake/ExternalLibCEED.cmake"
          # Ensure MFEM waits for sundials
          sed -i 's/set(MFEM_DEPENDENCIES hypre metis)/set(MFEM_DEPENDENCIES hypre metis sundials)/' "$PALACE_SRC/cmake/ExternalMFEM.cmake"

          cmake -S "$PALACE_SRC" -B "$PALACE_BUILD" \
            -G "Ninja" \
            -DCMAKE_INSTALL_PREFIX="$PALACE_INSTALL" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DBLA_VENDOR=OpenBLAS \
            -DBLAS_LIBRARIES="C:/msys64/mingw64/lib/libopenblas.dll.a" \
            -DLAPACK_LIBRARIES="C:/msys64/mingw64/lib/libopenblas.dll.a" \
            -DOpenMP_C_FLAGS="-fopenmp" \
            -DOpenMP_C_LIB_NAMES="gomp" \
            -DOpenMP_gomp_LIBRARY="C:/msys64/mingw64/lib/libgomp.dll.a" \
            -DOpenMP_CXX_FLAGS="-fopenmp" \
            -DOpenMP_CXX_LIB_NAMES="gomp" \
            -DOpenMP_Fortran_FLAGS="-fopenmp" \
            -DOpenMP_Fortran_LIB_NAMES="gomp" \
            -DBUILD_SHARED_LIBS=ON \
            -DPALACE_WITH_64BIT_INT=OFF \
            -DPALACE_WITH_OPENMP=ON \
            -DPALACE_WITH_CUDA=OFF \
            -DPALACE_WITH_HIP=OFF \
            -DPALACE_WITH_SUPERLU=OFF \
            -DPALACE_WITH_STRUMPACK=OFF \
            -DPALACE_WITH_MUMPS=OFF \
            -DPALACE_WITH_SLEPC=OFF \
            -DPALACE_WITH_ARPACK=ON \
            -DPALACE_WITH_LIBXSMM=ON \
            -DPALACE_WITH_MAGMA=OFF \
            -DPALACE_WITH_GSLIB=OFF \
            -DCMAKE_C_FLAGS="-Dffs=__builtin_ffs" \
            -DCMAKE_CXX_FLAGS="-Dffs=__builtin_ffs" 2>&1

          set +e
          cmake --build "$PALACE_BUILD" 2>&1 || rc=$?
          set -e
          if [ "${rc:-0}" -ne 0 ]; then
            # Clean MFEM build dir to avoid stale cache issues
            rm -rf "$PALACE_BUILD/extern/mfem-build" "$PALACE_BUILD/extern/mfem-cmake"
            # Patch libxsmm Makefile.inc WERROR
            XSMM_INC="$PALACE_BUILD/extern/libxsmm/Makefile.inc"
            [ -f "$XSMM_INC" ] && sed -i 's/WERROR_CFLAG.*:=.*/WERROR_CFLAG :=/' "$XSMM_INC" && echo "Patched libxsmm WERROR"
            # Force rebuild of libxsmm by removing stamp
            rm -f "$PALACE_BUILD/extern/libxsmm-cmake/src/libxsmm-stamp/libxsmm-build"
            rm -f "$PALACE_BUILD/extern/libxsmm/obj/intel64/generator_rv64_instructions.o"
            # Patch HYPRE: find _hypre_utilities.h anywhere in the build tree
            HYPRE_HDR=$(find "$PALACE_BUILD/extern/hypre" -name "_hypre_utilities.h" -print -quit 2>/dev/null)
            if [ -n "$HYPRE_HDR" ]; then
              sed -i 's/#define hypre_ffs(x) ffs(x)/#define hypre_ffs(x) __builtin_ffs(x)/' "$HYPRE_HDR" && echo "Patched HYPRE ffs"
              sed -i '/#include <malloc.h>/d' "$HYPRE_HDR" && echo "Patched HYPRE malloc.h"
              find "$PALACE_BUILD/extern/hypre" -name "*.c" -o -name "*.h" 2>/dev/null | xargs touch 2>/dev/null
              echo "Touched HYPRE sources for rebuild"
            fi
            set +e
            cmake --build "$PALACE_BUILD" 2>&1
            set -e
          fi
          echo "Palace build complete, checking for binary..."
          ls -la "$PALACE_INSTALL/bin/" 2>&1 || echo "No bin dir yet"

      - name: Stage Palace payload into binary package (Linux)
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          ls -lah /tmp/palace-install/bin
          ./packages/palacetoolkit-palace-cpu/tools/stage_palace_binary.sh \
            /tmp/palace-install/bin \
            /tmp/palace-install/lib \
            /tmp/palace-install/lib64

      - name: Stage Palace payload into binary package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $buildRoot = $env:RUNNER_TEMP
          if (-not $buildRoot) { $buildRoot = "C:\msys64\tmp" }
          $palaceInstall = "$buildRoot\palace-install"
          ls "$palaceInstall\bin"
          .\packages\palacetoolkit-palace-cpu\tools\stage_palace_binary.ps1 `
            -BinDir "$palaceInstall\bin" `
            -LibDirs "$palaceInstall\lib", "$palaceInstall\lib64"

      - name: Build wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build wheel
          python -m build --wheel packages/palacetoolkit-palace-cpu
          ls -lah packages/palacetoolkit-palace-cpu/dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: palacetoolkit-palace-cpu-${{ matrix.target }}
          path: packages/palacetoolkit-palace-cpu/dist/*.whl

      - name: Attach wheel to GitHub release
        if: startsWith(github.ref, 'refs/tags/palace-cpu-v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/palacetoolkit-palace-cpu/dist/*.whl
          generate_release_notes: true