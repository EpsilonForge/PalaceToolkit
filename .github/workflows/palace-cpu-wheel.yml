name: Build Palace CPU Wheel

on:
  workflow_dispatch:
    inputs:
      palace_ref:
        description: "Palace git ref (branch/tag/sha)"
        required: false
        default: "main"
  pull_request:
    paths:
      - "packages/palacetoolkit-palace-cpu/**"
      - ".github/workflows/palace-cpu-wheel.yml"
  push:
    tags:
      - "palace-cpu-v*"

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y \
            cmake gfortran openmpi-bin libopenmpi-dev libopenblas-dev pkg-config git make

      - name: Build Palace (cpu-default profile)
        env:
          PALACE_REF: ${{ inputs.palace_ref || 'main' }}
        run: |
          set -euo pipefail
          git clone https://github.com/awslabs/palace.git /tmp/palace-src
          git -C /tmp/palace-src fetch --all --tags
          git -C /tmp/palace-src checkout "$PALACE_REF"

          cmake -S /tmp/palace-src -B /tmp/palace-build \
            -DCMAKE_INSTALL_PREFIX=/tmp/palace-install \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-O3 -ffp-contract=fast -funroll-loops -march=native" \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_C_FLAGS="-O3 -ffp-contract=fast -funroll-loops -march=native" \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_Fortran_FLAGS="-O3 -ffp-contract=fast -funroll-loops -march=native" \
            -DBUILD_SHARED_LIBS:BOOL=ON \
            -DPALACE_WITH_64BIT_INT:BOOL=OFF \
            -DPALACE_WITH_OPENMP:BOOL=ON \
            -DPALACE_WITH_CUDA:BOOL=OFF \
            -DPALACE_WITH_HIP:BOOL=OFF \
            -DPALACE_WITH_SUPERLU:BOOL=ON \
            -DPALACE_WITH_STRUMPACK:BOOL=ON \
            -DPALACE_WITH_MUMPS:BOOL=ON \
            -DPALACE_WITH_SLEPC:BOOL=ON \
            -DPALACE_WITH_ARPACK:BOOL=ON \
            -DPALACE_WITH_LIBXSMM:BOOL=ON \
            -DPALACE_WITH_MAGMA:BOOL=OFF \
            -DPALACE_WITH_GSLIB:BOOL=ON

          cmake --build /tmp/palace-build --parallel "$(nproc)"

      - name: Stage Palace payload into binary package
        run: |
          set -euo pipefail
          ls -lah /tmp/palace-install/bin
          ./packages/palacetoolkit-palace-cpu/tools/stage_palace_binary.sh \
            /tmp/palace-install/bin \
            /tmp/palace-install/lib \
            /tmp/palace-install/lib64

      - name: Build wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build wheel
          python -m build --wheel packages/palacetoolkit-palace-cpu
          ls -lah packages/palacetoolkit-palace-cpu/dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: palacetoolkit-palace-cpu-linux-x86_64
          path: packages/palacetoolkit-palace-cpu/dist/*.whl

      - name: Attach wheel to GitHub release
        if: startsWith(github.ref, 'refs/tags/palace-cpu-v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/palacetoolkit-palace-cpu/dist/*.whl
          generate_release_notes: true

  # ------------------------------------------------------------------
  # 2. Build Windows x86_64 wheel
  # ------------------------------------------------------------------
  build-windows-x86_64:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MinGW toolchain and dependencies (MSYS2)
        shell: pwsh
        run: |
          $packages = @(
            "mingw-w64-x86_64-gcc",
            "mingw-w64-x86_64-gcc-fortran",
            "mingw-w64-x86_64-cmake",
            "mingw-w64-x86_64-make",
            "mingw-w64-x86_64-pkg-config",
            "mingw-w64-x86_64-msmpi",
            "mingw-w64-x86_64-openblas",
            "mingw-w64-x86_64-hdf5",
            "mingw-w64-x86_64-metis"
          )
          $maxRetries = 5
          for ($i = 0; $i -lt $maxRetries; $i++) {
            $output = & "C:\msys64\usr\bin\pacman.exe" -S --noconfirm @packages 2>&1
            $output | Out-Host
            if ($LASTEXITCODE -eq 0) { Write-Output "pacman succeeded"; break }
            Write-Output "pacman attempt $($i+1) failed, retrying in 30s..."
            Start-Sleep -Seconds 30
          }
          if ($LASTEXITCODE -ne 0) { throw "pacman failed after $maxRetries attempts" }

      - name: Build Palace (cpu-default profile)
        env:
          PALACE_REF: ${{ inputs.palace_ref || 'main' }}
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          $buildRoot = $env:RUNNER_TEMP
          if (-not $buildRoot) { $buildRoot = "C:\msys64\tmp" }
          $palaceSrc = "$buildRoot\palace-src"
          $palaceBuild = "$buildRoot\palace-build"
          $palaceInstall = "$buildRoot\palace-install"
          git clone https://github.com/awslabs/palace.git $palaceSrc
          git -C $palaceSrc fetch --all --tags
          git -C $palaceSrc checkout "$env:PALACE_REF"

          # Create a stub FindMPI.cmake to bypass the full MPI detection test
          ('set(MPI_C_FOUND TRUE)', 'set(MPI_CXX_FOUND TRUE)', 'set(MPI_Fortran_FOUND TRUE)', 'set(MPI_FOUND TRUE)', 'set(MPI_C_COMPILER "gcc")', 'set(MPI_CXX_COMPILER "g++")', 'set(MPI_Fortran_COMPILER "gfortran")', 'set(MPI_C_INCLUDE_DIRS "C:/msys64/mingw64/include")', 'set(MPI_CXX_INCLUDE_DIRS "C:/msys64/mingw64/include")', 'set(MPI_Fortran_INCLUDE_DIRS "C:/msys64/mingw64/include")', 'set(MPI_C_LIBRARIES "C:/msys64/mingw64/lib/libmsmpi.dll.a")', 'set(MPI_CXX_LIBRARIES "C:/msys64/mingw64/lib/libmsmpi.dll.a")', 'set(MPI_Fortran_LIBRARIES "C:/msys64/mingw64/lib/libmsmpi.dll.a")', 'set(MPIEXEC_EXECUTABLE "C:/msys64/mingw64/bin/mpiexec.exe")') -join "`n" | Set-Content -Path "$palaceSrc\cmake\FindMPI.cmake" -NoNewline -Encoding ascii

          # Fix patch file line endings (Windows git checkout may use CRLF which corrupts patches)
          Get-ChildItem -Path "$palaceSrc\extern\patch" -Recurse -Filter "*.diff" -Name | ForEach-Object {
            $f = "$palaceSrc\extern\patch\$_"
            $content = Get-Content $f -Raw
            $content = $content -replace "`r`n", "`n"
            Set-Content -Path $f -Value $content -NoNewline -Encoding ascii
          }

          cmake -S $palaceSrc -B $palaceBuild -G "Unix Makefiles" "-DCMAKE_INSTALL_PREFIX=$palaceInstall" "-DCMAKE_BUILD_TYPE=Release" "-DCMAKE_C_COMPILER=gcc" "-DCMAKE_CXX_COMPILER=g++" "-DCMAKE_Fortran_COMPILER=gfortran" "-DBLA_VENDOR=OpenBLAS" "-DBLAS_LIBRARIES=C:/msys64/mingw64/lib/libopenblas.dll.a" "-DLAPACK_LIBRARIES=C:/msys64/mingw64/lib/libopenblas.dll.a" "-DOpenMP_C_FLAGS=-fopenmp" "-DOpenMP_C_LIB_NAMES=gomp" "-DOpenMP_gomp_LIBRARY=C:/msys64/mingw64/lib/libgomp.dll.a" "-DOpenMP_CXX_FLAGS=-fopenmp" "-DOpenMP_CXX_LIB_NAMES=gomp" "-DOpenMP_Fortran_FLAGS=-fopenmp" "-DOpenMP_Fortran_LIB_NAMES=gomp" "-DBUILD_SHARED_LIBS:BOOL=ON" "-DPALACE_WITH_64BIT_INT:BOOL=OFF" "-DPALACE_WITH_OPENMP:BOOL=ON" "-DPALACE_WITH_CUDA:BOOL=OFF" "-DPALACE_WITH_HIP:BOOL=OFF" "-DPALACE_WITH_SUPERLU:BOOL=ON" "-DPALACE_WITH_STRUMPACK:BOOL=ON" "-DPALACE_WITH_MUMPS:BOOL=ON" "-DPALACE_WITH_SLEPC:BOOL=OFF" "-DPALACE_WITH_ARPACK:BOOL=ON" "-DPALACE_WITH_LIBXSMM:BOOL=ON" "-DPALACE_WITH_MAGMA:BOOL=OFF" "-DPALACE_WITH_GSLIB:BOOL=ON" 2>&1
          # Patch HYPRE utilities header for MinGW (missing ffs)
          $hypreFile = "$palaceSrc/extern/hypre/src/utilities/_hypre_utilities.h"
          if (Test-Path $hypreFile) {
            $content = Get-Content $hypreFile -Raw
            $content = $content -replace '#define hypre_ffs\(x\) ffs\(x\)', '#define hypre_ffs(x) __builtin_ffs(x)'
            Set-Content $hypreFile -Value $content -NoNewline -Encoding ascii
          }
          cmake --build $palaceBuild 2>&1

      - name: Stage Palace payload into binary package
        shell: pwsh
        run: |
          $buildRoot = $env:RUNNER_TEMP
          if (-not $buildRoot) { $buildRoot = "C:\msys64\tmp" }
          $palaceInstall = "$buildRoot\palace-install"
          ls $palaceInstall/bin
          .\packages\palacetoolkit-palace-cpu\tools\stage_palace_binary.ps1 `
            -BinDir "$palaceInstall\bin" `
            -LibDirs "$palaceInstall\lib", "$palaceInstall\lib64"

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build --wheel packages/palacetoolkit-palace-cpu
          ls packages/palacetoolkit-palace-cpu/dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: palacetoolkit-palace-cpu-win-amd64
          path: packages/palacetoolkit-palace-cpu/dist/*.whl

      - name: Attach wheel to GitHub release
        if: startsWith(github.ref, 'refs/tags/palace-cpu-v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/palacetoolkit-palace-cpu/dist/*.whl
          generate_release_notes: true
