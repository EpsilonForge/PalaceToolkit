name: Build Palace CPU Wheel

on:
  workflow_dispatch:
    inputs:
      palace_ref:
        description: "Palace git ref (branch/tag/sha)"
        required: false
        default: "main"
  pull_request:
    paths:
      - "packages/palacetoolkit-palace-cpu/**"
      - ".github/workflows/palace-cpu-wheel.yml"
  push:
    tags:
      - "palace-cpu-v*"

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y \
            cmake gfortran openmpi-bin libopenmpi-dev libopenblas-dev pkg-config git make

      - name: Build Palace (cpu-default profile)
        env:
          PALACE_REF: ${{ inputs.palace_ref || 'main' }}
        run: |
          set -euo pipefail
          git clone https://github.com/awslabs/palace.git /tmp/palace-src
          git -C /tmp/palace-src fetch --all --tags
          git -C /tmp/palace-src checkout "$PALACE_REF"

          cmake -S /tmp/palace-src -B /tmp/palace-build \
            -DCMAKE_INSTALL_PREFIX=/tmp/palace-install \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-O3 -ffp-contract=fast -funroll-loops -march=native" \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_C_FLAGS="-O3 -ffp-contract=fast -funroll-loops -march=native" \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_Fortran_FLAGS="-O3 -ffp-contract=fast -funroll-loops -march=native" \
            -DBUILD_SHARED_LIBS:BOOL=ON \
            -DPALACE_WITH_64BIT_INT:BOOL=OFF \
            -DPALACE_WITH_OPENMP:BOOL=ON \
            -DPALACE_WITH_CUDA:BOOL=OFF \
            -DPALACE_WITH_HIP:BOOL=OFF \
            -DPALACE_WITH_SUPERLU:BOOL=ON \
            -DPALACE_WITH_STRUMPACK:BOOL=ON \
            -DPALACE_WITH_MUMPS:BOOL=ON \
            -DPALACE_WITH_SLEPC:BOOL=ON \
            -DPALACE_WITH_ARPACK:BOOL=ON \
            -DPALACE_WITH_LIBXSMM:BOOL=ON \
            -DPALACE_WITH_MAGMA:BOOL=OFF \
            -DPALACE_WITH_GSLIB:BOOL=ON

          cmake --build /tmp/palace-build --parallel "$(nproc)"

      - name: Stage Palace payload into binary package
        run: |
          set -euo pipefail
          ls -lah /tmp/palace-install/bin
          ./packages/palacetoolkit-palace-cpu/tools/stage_palace_binary.sh \
            /tmp/palace-install/bin \
            /tmp/palace-install/lib \
            /tmp/palace-install/lib64

      - name: Build wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build wheel
          python -m build --wheel packages/palacetoolkit-palace-cpu
          ls -lah packages/palacetoolkit-palace-cpu/dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: palacetoolkit-palace-cpu-linux-x86_64
          path: packages/palacetoolkit-palace-cpu/dist/*.whl

      - name: Attach wheel to GitHub release
        if: startsWith(github.ref, 'refs/tags/palace-cpu-v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/palacetoolkit-palace-cpu/dist/*.whl
          generate_release_notes: true

  # ------------------------------------------------------------------
  # 2. Build Windows x86_64 wheel
  # ------------------------------------------------------------------
build-windows-x86_64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cross-compilation toolchain
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y \
            cmake g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gfortran-mingw-w64-x86-64 \
            pkg-config-mingw-w64-x86-64

      - name: Build Palace (cross-compile for Windows)
        env:
          PALACE_REF: ${{ inputs.palace_ref || 'main' }}
        run: |
          set -euo pipefail
          export TOOLCHAIN_PREFIX=x86_64-w64-mingw32
          export CC=${TOOLCHAIN_PREFIX}-gcc
          export CXX=${TOOLCHAIN_PREFIX}-g++
          export FC=${TOOLCHAIN_PREFIX}-gfortran
          export WINDRES=${TOOLCHAIN_PREFIX}-windres
          export PKG_CONFIG=${TOOLCHAIN_PREFIX}-pkg-config

          git clone https://github.com/awslabs/palace.git /tmp/palace-src
          git -C /tmp/palace-src fetch --all --tags
          git -C /tmp/palace-src checkout "$PALACE_REF"

          # Create a stub FindMPI.cmake (MSMPI not available for cross-compile)
          mkdir -p /tmp/palace-src/cmake
          for var in "MPI_C_FOUND TRUE" "MPI_CXX_FOUND TRUE" "MPI_Fortran_FOUND TRUE" "MPI_FOUND TRUE" "MPI_C_COMPILER ${TOOLCHAIN_PREFIX}-gcc" "MPI_CXX_COMPILER ${TOOLCHAIN_PREFIX}-g++" "MPI_Fortran_COMPILER ${TOOLCHAIN_PREFIX}-gfortran" "MPI_C_LIBRARIES" "MPI_CXX_LIBRARIES" "MPI_Fortran_LIBRARIES" "MPIEXEC_EXECUTABLE"; do echo "set($var)" >> /tmp/palace-src/cmake/FindMPI.cmake; done

          # Fix patch file line endings
          find /tmp/palace-src/extern/patch -name "*.diff" -exec sed -i 's/\r$//' {} \;

          cmake -S /tmp/palace-src -B /tmp/palace-build \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_Fortran_COMPILER="${FC}" \
            -DCMAKE_INSTALL_PREFIX=/tmp/palace-install \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DPALACE_WITH_64BIT_INT=OFF \
            -DPALACE_WITH_OPENMP=ON \
            -DPALACE_WITH_CUDA=OFF \
            -DPALACE_WITH_HIP=OFF \
            -DPALACE_WITH_SUPERLU=ON \
            -DPALACE_WITH_STRUMPACK=ON \
            -DPALACE_WITH_MUMPS=ON \
            -DPALACE_WITH_SLEPC=OFF \
            -DPALACE_WITH_ARPACK=ON \
            -DPALACE_WITH_LIBXSMM=ON \
            -DPALACE_WITH_MAGMA=OFF \
            -DPALACE_WITH_GSLIB=ON

          cmake --build /tmp/palace-build --parallel "$(nproc)" 2>&1

      - name: Stage Palace payload into binary package
        run: |
          set -euo pipefail
          ls -lah /tmp/palace-install/bin
          ./packages/palacetoolkit-palace-cpu/tools/stage_palace_binary.sh \
            /tmp/palace-install/bin \
            /tmp/palace-install/lib \
            /tmp/palace-install/lib64

      - name: Build wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build wheel
          python -m build --wheel packages/palacetoolkit-palace-cpu
          ls -lah packages/palacetoolkit-palace-cpu/dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: palacetoolkit-palace-cpu-win-amd64
          path: packages/palacetoolkit-palace-cpu/dist/*.whl

      - name: Attach wheel to GitHub release
        if: startsWith(github.ref, 'refs/tags/palace-cpu-v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/palacetoolkit-palace-cpu/dist/*.whl
          generate_release_notes: true
