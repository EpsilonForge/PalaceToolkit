name: Build Palace CPU Wheel

on:
  workflow_dispatch:
    inputs:
      palace_ref:
        description: "Palace git ref (branch/tag/sha)"
        required: false
        default: "main"
  pull_request:
    paths:
      - "packages/palacetoolkit-palace-cpu/**"
      - ".github/workflows/palace-cpu-wheel.yml"
  push:
    tags:
      - "palace-cpu-v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt update && sudo apt install -y \
            cmake gfortran openmpi-bin libopenmpi-dev libopenblas-dev pkg-config git make
      - name: Build Palace
        env:
          PALACE_REF: ${{ inputs.palace_ref || 'main' }}
        run: |
          set -euo pipefail
          git clone https://github.com/awslabs/palace.git /tmp/palace-src
          git -C /tmp/palace-src fetch --all --tags && git checkout "$PALACE_REF"
          cmake -S /tmp/palace-src -B /tmp/palace-build \
            -DCMAKE_INSTALL_PREFIX=/tmp/palace-install -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS="-O3 -march=native" \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_C_FLAGS="-O3 -march=native" \
            -DCMAKE_Fortran_COMPILER=gfortran -DCMAKE_Fortran_FLAGS="-O3 -march=native" \
            -DBUILD_SHARED_LIBS=ON -DPALACE_WITH_64BIT_INT=OFF -DPALACE_WITH_OPENMP=ON \
            -DPALACE_WITH_CUDA=OFF -DPALACE_WITH_HIP=OFF -DPALACE_WITH_SUPERLU=ON \
            -DPALACE_WITH_STRUMPACK=ON -DPALACE_WITH_MUMPS=ON -DPALACE_WITH_SLEPC=ON \
            -DPALACE_WITH_ARPACK=ON -DPALACE_WITH_LIBXSMM=ON -DPALACE_WITH_MAGMA=OFF \
            -DPALACE_WITH_GSLIB=ON
          cmake --build /tmp/palace-build --parallel "$(nproc)"
      - name: Stage Palace payload
        run: |
          ls -lah /tmp/palace-install/bin
          ./packages/palacetoolkit-palace-cpu/tools/stage_palace_binary.sh \
            /tmp/palace-install/bin /tmp/palace-install/lib /tmp/palace-install/lib64
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build --wheel packages/palacetoolkit-palace-cpu
          ls -lah packages/palacetoolkit-palace-cpu/dist
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: palacetoolkit-palace-cpu-linux-x86_64
          path: packages/palacetoolkit-palace-cpu/dist/*.whl
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/palace-cpu-v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/palacetoolkit-palace-cpu/dist/*.whl
          generate_release_notes: true

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Intel oneAPI Fortran
        shell: pwsh
        run: |
          # Download and install Intel oneAPI HPC Toolkit (includes Fortran + MKL)
          $url = "https://registrationcenter-download.intel.com/akdlm/irc_nas/20624/w_HPCTK_2025.0.1.6935_offline.exe"
          $installer = "$env:TEMP\intel_hpc.exe"
          Write-Output "Downloading Intel oneAPI HPC Toolkit..."
          Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 600
          Write-Output "Installing Intel oneAPI (Fortran + MKL only)..."
          Start-Process -FilePath $installer -ArgumentList "--silent --eula accept --components=intel.oneapi.win.fortran-compiler:intel.oneapi.win.mkl" -Wait -NoNewWindow
          Write-Output "Intel oneAPI installed"

      - name: Install MS-MPI
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/Microsoft-MPI/releases/download/v10.1.1/msmpisetup.exe"
          $installer = "$env:TEMP\msmpi.exe"
          Write-Output "Downloading MS-MPI..."
          Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 300
          Start-Process -FilePath $installer -ArgumentList "-unattend -force" -Wait -NoNewWindow
          Write-Output "MS-MPI installed"

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $packages = @(
            "hypre", "metis", "arpack-ng", "nlohmann-json", "fmt",
            "eigen3", "superlu-dist", "strumpack", "mumps", "gslib",
            "sundials", "scalapack", "openblas"
          )
          foreach ($pkg in $packages) {
            Write-Output "Installing $pkg..."
            vcpkg install "$pkg:x64-windows" 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Output "Warning: $pkg failed" }
          }
          Write-Output "vcpkg install complete"

      - name: Build Palace (cpu-default profile)
        env:
          PALACE_REF: ${{ inputs.palace_ref || 'main' }}
        shell: pwsh
        run: |
          # Set up Intel oneAPI environment
          cmd.exe /c "C:\Program Files (x86)\Intel\oneAPI\setvars.bat && set > C:\intel_env.txt"
          Get-Content C:\intel_env.txt | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], "Process")
            }
          }

          $env:PATH = "C:\Program Files (x86)\Intel\oneAPI\compiler\latest\bin;$env:PATH"
          $env:PATH = "C:\Program Files\Microsoft MPI\Bin;$env:PATH"

          $VCPKG_ROOT = "C:\vcpkg"
          $VCPKG_TRIPLET = "x64-windows"

          git clone https://github.com/awslabs/palace.git /tmp/palace-src
          git -C /tmp/palace-src fetch --all --tags
          git -C /tmp/palace-src checkout "$env:PALACE_REF"

          cmake -S /tmp/palace-src/palace -B /tmp/palace-build `
            -DCMAKE_INSTALL_PREFIX=/tmp/palace-install `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_Fortran_COMPILER=ifx `
            -DBUILD_SHARED_LIBS=ON `
            -DPALACE_WITH_64BIT_INT=OFF `
            -DPALACE_WITH_OPENMP=ON `
            -DPALACE_WITH_CUDA=OFF `
            -DPALACE_WITH_HIP=OFF `
            -DPALACE_WITH_SUPERLU=ON `
            -DPALACE_WITH_STRUMPACK=ON `
            -DPALACE_WITH_MUMPS=ON `
            -DPALACE_WITH_SLEPC=OFF `
            -DPALACE_WITH_ARPACK=ON `
            -DPALACE_WITH_LIBXSMM=ON `
            -DPALACE_WITH_MAGMA=OFF `
            -DPALACE_WITH_GSLIB=ON `
            -DPALACE_WITH_SUNDIALS=ON

          cmake --build /tmp/palace-build --config Release

      - name: Stage Palace payload into binary package
        shell: pwsh
        run: |
          ls /tmp/palace-install/bin
          .\packages\palacetoolkit-palace-cpu\tools\stage_palace_binary.ps1 `
            -BinDir /tmp/palace-install/bin `
            -LibDirs /tmp/palace-install/lib, /tmp/palace-install/lib64

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build --wheel packages/palacetoolkit-palace-cpu
          ls packages/palacetoolkit-palace-cpu/dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: palacetoolkit-palace-cpu-win-amd64
          path: packages/palacetoolkit-palace-cpu/dist/*.whl

      - name: Attach wheel to GitHub release
        if: startsWith(github.ref, 'refs/tags/palace-cpu-v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/palacetoolkit-palace-cpu/dist/*.whl
          generate_release_notes: true