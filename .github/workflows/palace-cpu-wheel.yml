name: Build Palace CPU Wheel

on:
  workflow_dispatch:
    inputs:
      palace_ref:
        description: "Palace git ref (branch/tag/sha)"
        required: false
        default: "main"
  pull_request:
    paths:
      - "packages/palacetoolkit-palace-cpu/**"
      - ".github/workflows/palace-cpu-wheel.yml"
  push:
    tags:
      - "palace-cpu-v*"

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y \
            cmake gfortran openmpi-bin libopenmpi-dev libopenblas-dev pkg-config git make

      - name: Build Palace (cpu-default profile)
        env:
          PALACE_REF: ${{ inputs.palace_ref || 'main' }}
        run: |
          set -euo pipefail
          git clone https://github.com/awslabs/palace.git /tmp/palace-src
          git -C /tmp/palace-src fetch --all --tags
          git -C /tmp/palace-src checkout "$PALACE_REF"

          cmake -S /tmp/palace-src -B /tmp/palace-build \
            -DCMAKE_INSTALL_PREFIX=/tmp/palace-install \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-O3 -ffp-contract=fast -funroll-loops -march=native" \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_C_FLAGS="-O3 -ffp-contract=fast -funroll-loops -march=native" \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_Fortran_FLAGS="-O3 -ffp-contract=fast -funroll-loops -march=native" \
            -DBUILD_SHARED_LIBS:BOOL=ON \
            -DPALACE_WITH_64BIT_INT:BOOL=OFF \
            -DPALACE_WITH_OPENMP:BOOL=ON \
            -DPALACE_WITH_CUDA:BOOL=OFF \
            -DPALACE_WITH_HIP:BOOL=OFF \
            -DPALACE_WITH_SUPERLU:BOOL=ON \
            -DPALACE_WITH_STRUMPACK:BOOL=ON \
            -DPALACE_WITH_MUMPS:BOOL=ON \
            -DPALACE_WITH_SLEPC:BOOL=ON \
            -DPALACE_WITH_ARPACK:BOOL=ON \
            -DPALACE_WITH_LIBXSMM:BOOL=ON \
            -DPALACE_WITH_MAGMA:BOOL=OFF \
            -DPALACE_WITH_GSLIB:BOOL=ON

          cmake --build /tmp/palace-build --parallel "$(nproc)"

      - name: Stage Palace payload into binary package
        run: |
          set -euo pipefail
          ls -lah /tmp/palace-install/bin
          ./packages/palacetoolkit-palace-cpu/tools/stage_palace_binary.sh \
            /tmp/palace-install/bin \
            /tmp/palace-install/lib \
            /tmp/palace-install/lib64

      - name: Build wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build wheel
          python -m build --wheel packages/palacetoolkit-palace-cpu
          ls -lah packages/palacetoolkit-palace-cpu/dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: palacetoolkit-palace-cpu-linux-x86_64
          path: packages/palacetoolkit-palace-cpu/dist/*.whl

      - name: Attach wheel to GitHub release
        if: startsWith(github.ref, 'refs/tags/palace-cpu-v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/palacetoolkit-palace-cpu/dist/*.whl
          generate_release_notes: true

  # ------------------------------------------------------------------
  # 2. Build Windows x86_64 wheel
  # ------------------------------------------------------------------
  build-windows-x86_64:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MinGW toolchain and dependencies (MSYS2)
        shell: pwsh
        run: |
          $packages = @(
            "mingw-w64-x86_64-gcc",
            "mingw-w64-x86_64-gcc-fortran",
            "mingw-w64-x86_64-cmake",
            "mingw-w64-x86_64-make",
            "mingw-w64-x86_64-pkg-config",
            "mingw-w64-x86_64-msmpi",
            "mingw-w64-x86_64-openblas",
            "mingw-w64-x86_64-hdf5",
            "mingw-w64-x86_64-metis"
          )
          $maxRetries = 5
          for ($i = 0; $i -lt $maxRetries; $i++) {
            $output = & "C:\msys64\usr\bin\pacman.exe" -S --noconfirm @packages 2>&1
            $output | Out-Host
            if ($LASTEXITCODE -eq 0) { Write-Output "pacman succeeded"; break }
            Write-Output "pacman attempt $($i+1) failed, retrying in 30s..."
            Start-Sleep -Seconds 30
          }
          if ($LASTEXITCODE -ne 0) { throw "pacman failed after $maxRetries attempts" }

      - name: Build Palace (cpu-default profile)
        env:
          PALACE_REF: ${{ inputs.palace_ref || 'main' }}
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          git clone https://github.com/awslabs/palace.git /tmp/palace-src
          git -C /tmp/palace-src fetch --all --tags
          git -C /tmp/palace-src checkout "$env:PALACE_REF"

          # Inject MPI overrides before Palace's find_package(MPI)
          "set(MPI_C_SKIP_GUESSING TRUE)" | Out-File -FilePath /tmp/palace-src/cmake/MPIOverrides.cmake -Encoding utf8
          Add-Content -Path /tmp/palace-src/cmake/MPIOverrides.cmake -Value 'set(MPI_C_INCLUDE_DIR "C:/msys64/mingw64/include")' -Encoding utf8
          Add-Content -Path /tmp/palace-src/cmake/MPIOverrides.cmake -Value 'set(MPI_C_LIBRARIES "C:/msys64/mingw64/lib/libmsmpi.dll.a")' -Encoding utf8
          Add-Content -Path /tmp/palace-src/cmake/MPIOverrides.cmake -Value 'set(MPI_CXX_SKIP_GUESSING TRUE)' -Encoding utf8
          Add-Content -Path /tmp/palace-src/cmake/MPIOverrides.cmake -Value 'set(MPI_CXX_INCLUDE_DIR "C:/msys64/mingw64/include")' -Encoding utf8
          Add-Content -Path /tmp/palace-src/cmake/MPIOverrides.cmake -Value 'set(MPI_CXX_LIBRARIES "C:/msys64/mingw64/lib/libmsmpi.dll.a")' -Encoding utf8
          Add-Content -Path /tmp/palace-src/cmake/MPIOverrides.cmake -Value 'set(MPI_Fortran_SKIP_GUESSING TRUE)' -Encoding utf8
          Add-Content -Path /tmp/palace-src/cmake/MPIOverrides.cmake -Value 'set(MPI_Fortran_INCLUDE_DIR "C:/msys64/mingw64/include")' -Encoding utf8
          Add-Content -Path /tmp/palace-src/cmake/MPIOverrides.cmake -Value 'set(MPI_Fortran_LIBRARIES "C:/msys64/mingw64/lib/libmsmpi.dll.a")' -Encoding utf8
          $content = Get-Content /tmp/palace-src/CMakeLists.txt -Raw
          $content = $content.Replace('find_package(MPI REQUIRED)', 'include(cmake/MPIOverrides.cmake)' + "`n" + 'find_package(MPI REQUIRED)')
          Set-Content -Path /tmp/palace-src/CMakeLists.txt -Value $content -Encoding ascii

          # Diagnostic: test MPI compilation and linking
          Set-Content -Path /tmp/test_mpi.c -Value '#include <mpi.h>', 'int main(int argc, char** argv) { MPI_Init(&argc, &argv); MPI_Finalize(); return 0; }' -Encoding utf8
          gcc -IC:/msys64/mingw64/include -c /tmp/test_mpi.c -o /tmp/test_mpi.o 2>&1
          if ($LASTEXITCODE -eq 0) { Write-Output "MPI compile OK" } else { Write-Output "MPI compile FAILED" }
          gcc /tmp/test_mpi.o -LC:/msys64/mingw64/lib -lmsmpi -o /tmp/test_mpi.exe 2>&1
          if ($LASTEXITCODE -eq 0) { Write-Output "MPI link OK" } else { Write-Output "MPI link FAILED" }

          # Pre-set MPI variables so FindMPI skips the test compilation
          "set(MPI_C_WORKS TRUE)" | Out-File -FilePath /tmp/palace-src/cmake/MPIOverrides.cmake -Encoding utf8
          Add-Content -Path /tmp/palace-src/cmake/MPIOverrides.cmake -Value 'set(MPI_CXX_WORKS TRUE)' -Encoding utf8
          Add-Content -Path /tmp/palace-src/cmake/MPIOverrides.cmake -Value 'set(MPI_Fortran_WORKS TRUE)' -Encoding utf8

          cmake -S /tmp/palace-src -B /tmp/palace-build `
            -G "MSYS Makefiles" `
            -DCMAKE_INSTALL_PREFIX=/tmp/palace-install `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc `
            -DCMAKE_CXX_COMPILER=g++ `
            -DCMAKE_Fortran_COMPILER=gfortran `
            -DMPI_C_INCLUDE_DIR="C:/msys64/mingw64/include" `
            -DMPI_C_LIBRARIES="C:/msys64/mingw64/lib/libmsmpi.dll.a" `
            -DMPI_CXX_INCLUDE_DIR="C:/msys64/mingw64/include" `
            -DMPI_CXX_LIBRARIES="C:/msys64/mingw64/lib/libmsmpi.dll.a" `
            -DMPI_Fortran_INCLUDE_DIR="C:/msys64/mingw64/include" `
            -DMPI_Fortran_LIBRARIES="C:/msys64/mingw64/lib/libmsmpi.dll.a" `
            -DBUILD_SHARED_LIBS:BOOL=ON `
            -DPALACE_WITH_64BIT_INT:BOOL=OFF `
            -DPALACE_WITH_OPENMP:BOOL=ON `
            -DPALACE_WITH_CUDA:BOOL=OFF `
            -DPALACE_WITH_HIP:BOOL=OFF `
            -DPALACE_WITH_SUPERLU:BOOL=ON `
            -DPALACE_WITH_STRUMPACK:BOOL=ON `
            -DPALACE_WITH_MUMPS:BOOL=ON `
            -DPALACE_WITH_SLEPC:BOOL=OFF `
            -DPALACE_WITH_ARPACK:BOOL=ON `
            -DPALACE_WITH_LIBXSMM:BOOL=ON `
            -DPALACE_WITH_MAGMA:BOOL=OFF `
            -DPALACE_WITH_GSLIB:BOOL=ON

          cmake --build /tmp/palace-build --parallel

      - name: Stage Palace payload into binary package
        shell: pwsh
        run: |
          ls /tmp/palace-install/bin
          .\packages\palacetoolkit-palace-cpu\tools\stage_palace_binary.ps1 `
            -BinDir /tmp/palace-install/bin `
            -LibDirs /tmp/palace-install/lib, /tmp/palace-install/lib64

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build --wheel packages/palacetoolkit-palace-cpu
          ls packages/palacetoolkit-palace-cpu/dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: palacetoolkit-palace-cpu-win-amd64
          path: packages/palacetoolkit-palace-cpu/dist/*.whl

      - name: Attach wheel to GitHub release
        if: startsWith(github.ref, 'refs/tags/palace-cpu-v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/palacetoolkit-palace-cpu/dist/*.whl
          generate_release_notes: true
