name: Docs Doctest

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-doctest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  # Fast static checks: import resolution, prefix correctness, code unit tests
  static-checks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system libraries (Gmsh/PyVista deps)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglu1-mesa-dev libgomp1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Run static doc-import checks and unit tests
        run: |
          set -euo pipefail
          python -m pytest tests/test_doc_imports.py tests/test_postpro.py tests/test_simulation_run_palace.py tests/test_postpro_vtu.py -v

  # Sphinx docs build (catches markup / cross-reference errors)
  docs-build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Run docs build doctest
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_docs_build.py

  # Notebook execution tests (slow, time-limited per notebook)
  notebook-execution:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system libraries (Gmsh deps)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglu1-mesa-dev libgomp1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install notebook test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
          pip install pytest-timeout

      - name: Register Jupyter kernel
        run: |
          set -euo pipefail
          python -m ipykernel install --user --name palacetoolkit --display-name "PalaceToolkit"

      - name: Run notebook execution tests (10 min timeout per notebook)
        run: |
          set -euo pipefail
          python -m pytest tests/test_docs_notebooks.py -v \
            --timeout=600 --timeout-method=signal \
            -o faulthandler_timeout=700

  # Fresh install simulation: install from sdist and run unit tests
  fresh-install:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system libraries (Gmsh deps)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglu1-mesa-dev libgomp1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Install in fresh venv
        run: |
          set -euo pipefail
          python -m venv /tmp/fresh-venv
          /tmp/fresh-venv/bin/pip install dist/palace_toolkit-*.tar.gz

      - name: Run non-docs tests
        run: |
          set -euo pipefail
          /tmp/fresh-venv/bin/pip install pytest
          /tmp/fresh-venv/bin/python -m pytest tests/test_postpro.py tests/test_postpro_vtu.py tests/test_simulation_run_palace.py -v