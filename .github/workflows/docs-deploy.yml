name: Deploy PalaceToolkit Docs

on:
  workflow_run:
    workflows: ["PalaceToolkit Docs"]
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars['EPSILON_FORGE_AWS_ACCOUNT_ID'] || '527097962874' }}:role/epsilon-forge-palace-toolkit-docs-deploy-production
          aws-region: us-east-2
          role-session-name: palacetoolkit-docs-deploy

      - name: Install deploy dependencies
        run: |
          set -euo pipefail
          npm install --no-fund --no-audit

      - name: Download built site
        uses: actions/download-pages-artifact@v3
        with:
          path: site

      - name: Deploy docs
        env:
          SST_STAGE: production
        run: |
          set -euo pipefail
          npx sst deploy --stage "$SST_STAGE"